name: Codex troubleshooting verification
on:
  push:
    branches: [validation/codex25-lan4]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q && python -m compileall -q app.py tests
      - run: bash .github/scripts/codex-troubleshoot.sh
