services:
  lan-paste:
    build: .
    container_name: lan-paste
    restart: unless-stopped
    ports:
      # Bind on all host interfaces for LAN access. Restrict this port with your host firewall.
      - "8000:8000"
    environment:
      DATA_DIR: /data
      DEFAULT_TTL_HOURS: "24"
      MAX_PASTE_BYTES: ${MAX_PASTE_BYTES-1048576}
      # Required for DELETE API requests. Set it in the untracked .env file.
      PASTE_ADMIN_TOKEN: ${PASTE_ADMIN_TOKEN:?Set PASTE_ADMIN_TOKEN in .env}
    volumes:
      - paste_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Startup chowns the volume, then su switches to the unprivileged appuser.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID

volumes:
  paste_data:
